<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="cognitensor-favicon-title"
>
  <title id="cognitensor-favicon-title">Cognitensor</title>
  <defs>
    <radialGradient id="tile" cx="0" cy="0" r="1" gradientTransform="translate(18 12) rotate(46) scale(67)">
      <stop stop-color="#242950" />
      <stop offset="1" stop-color="#0d1022" />
    </radialGradient>
    <linearGradient id="ribbon" x1="50" y1="10" x2="17" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38e8bd" />
      <stop offset="0.22" stop-color="#20bde8" />
      <stop offset="0.5" stop-color="#7257f5" />
      <stop offset="0.76" stop-color="#dd4cbd" />
      <stop offset="1" stop-color="#ff9d78" />
