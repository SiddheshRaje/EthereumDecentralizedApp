  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <path
